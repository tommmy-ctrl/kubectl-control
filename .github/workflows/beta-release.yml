name: Beta Release (Marketplace Pre-Release)

# Builds a pre-release .vsix on every push to `beta` and publishes it ONLY as a
# GitHub Pre-Release (for sideload/testing). Betas do NOT go to the VS Code
# Marketplace — testers install the .vsix manually and get NO auto-update.
# Versioning is plain SemVer: package.json on `beta` carries the TARGET stable
# version (e.g. 1.3.0) — VS Code requires this field to stay a bare X.Y.Z, so the
# suffix cannot live there. Instead, each push gets its own SemVer pre-release
# identifier `beta.N` (N auto-incrementing per target version) applied ONLY to the
# git tag / release name / .vsix filename: `beta-vX.Y.Z-beta.N`. This makes every
# beta build individually identifiable and keeps prior beta releases intact
# instead of overwriting them.

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: beta-release
  cancel-in-progress: true

jobs:
  beta:
    name: Build & Publish Pre-Release to Marketplace
    runs-on: ubuntu-latest

    permissions:
      contents: write   # create GitHub pre-release & upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed to compute the next beta.N

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache VS Code test binary
        uses: actions/cache@v4
        with:
          path: ~/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Quality gates
        run: |
          npx tsc --noEmit -p .
          npm run lint
          npm run compile-tests
          xvfb-run -a npm test

      - name: Security audit (production deps)
        run: npm audit --audit-level=high --omit=dev

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determine next beta build number
        id: betaver
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          LAST=$(git tag -l "beta-v${VERSION}-beta.*" | sed -E 's/.*-beta\.([0-9]+)$/\1/' | sort -n | tail -1)
          NEXT=$(( ${LAST:-0} + 1 ))
          echo "build=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=beta-v${VERSION}-beta.${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Build extension (production webpack)
        run: npm run package

      - name: Convert SVG icon to PNG (128x128)
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 128 -h 128 resources/icon.svg -o resources/icon.png

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package pre-release .vsix
        run: vsce package --pre-release --out kubectl-control-${{ steps.ver.outputs.version }}-beta.${{ steps.betaver.outputs.build }}.vsix

      - name: Create GitHub Pre-Release (sideload .vsix)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.betaver.outputs.tag }}
          name: Beta v${{ steps.ver.outputs.version }} (build ${{ steps.betaver.outputs.build }})
          prerelease: true
          generate_release_notes: true
          files: kubectl-control-${{ steps.ver.outputs.version }}-beta.${{ steps.betaver.outputs.build }}.vsix
          body: |
            Beta build for **manual sideload** (download the `.vsix` below →
            VS Code ▸ Extensions ▸ "Install from VSIX…").

            This build is **not** on the VS Code Marketplace. Users of the stable
            version are **not** updated by this.
