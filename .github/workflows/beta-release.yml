name: Beta Release (GitHub Pre-Release, sideload only — not published to the Marketplace)

# Builds a pre-release .vsix on every push to `beta` and publishes it ONLY as a
# GitHub Pre-Release (for sideload/testing). Betas do NOT go to the VS Code
# Marketplace — testers install the .vsix manually and get NO auto-update.
# Versioning is plain SemVer: package.json on `beta` carries the TARGET stable
# version (e.g. 1.3.0) — VS Code requires this field to stay a bare X.Y.Z, no
# suffix. Each push updates the SAME `beta-vX.Y.Z` tag/release (single entry per
# target version, no accumulating beta.N tags). The exact build currently
# installed is instead identifiable from inside the extension itself: the
# short commit SHA is baked into the build and shown next to the version in
# the connection form's footer (see src/webviews/templates.ts).

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: beta-release
  cancel-in-progress: true

jobs:
  beta:
    name: Build & Publish GitHub Pre-Release (.vsix sideload)
    runs-on: ubuntu-latest

    permissions:
      contents: write   # create GitHub pre-release & upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache VS Code test binary
        uses: actions/cache@v4
        with:
          path: ~/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Quality gates
        run: |
          npx tsc --noEmit -p .
          npm run lint
          npm run compile-tests
          xvfb-run -a npm test

      - name: Security audit (production deps)
        run: npm audit --audit-level=high --omit=dev

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build extension (production webpack)
        run: npm run package
        env:
          BUILD_SHA: ${{ github.sha }}

      - name: Convert SVG icon to PNG (128x128)
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 128 -h 128 resources/icon.svg -o resources/icon.png

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package pre-release .vsix
        run: vsce package --pre-release --out kubectl-control-${{ steps.ver.outputs.version }}.vsix

      - name: Create / update GitHub Pre-Release (sideload .vsix)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v${{ steps.ver.outputs.version }}
          name: Beta v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: kubectl-control-${{ steps.ver.outputs.version }}.vsix
          body: |
            Beta build for **manual sideload** (download the `.vsix` below →
            VS Code ▸ Extensions ▸ "Install from VSIX…"). Once installed, the exact
            build is shown next to the version number in the connection form's footer.

            This build is **not** on the VS Code Marketplace. Users of the stable
            version are **not** updated by this.
