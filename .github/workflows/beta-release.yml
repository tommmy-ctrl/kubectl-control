name: Beta Release (Marketplace Pre-Release)

# Builds a pre-release .vsix on every push to `beta` and publishes it ONLY as a
# GitHub Pre-Release (for sideload/testing). Betas do NOT go to the VS Code
# Marketplace — testers install the .vsix manually and get NO auto-update.
# Versioning is plain SemVer: package.json on `beta` carries the TARGET stable
# version (e.g. 1.3.0). Betas are distinguished solely by the `beta-vX.Y.Z` tag.

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: beta-release
  cancel-in-progress: true

jobs:
  beta:
    name: Build & Publish Pre-Release to Marketplace
    runs-on: ubuntu-latest

    permissions:
      contents: write   # create GitHub pre-release & upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache VS Code test binary
        uses: actions/cache@v6
        with:
          path: ~/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Quality gates
        run: |
          npx tsc --noEmit -p .
          npm run lint
          npm run compile-tests
          xvfb-run -a npm test

      - name: Security audit (production deps)
        run: npm audit --audit-level=high --omit=dev

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build extension (production webpack)
        run: npm run package

      - name: Convert SVG icon to PNG (128x128)
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 128 -h 128 resources/icon.svg -o resources/icon.png

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package pre-release .vsix
        run: vsce package --pre-release --out kubectl-control-${{ steps.ver.outputs.version }}.vsix

      - name: Create / update GitHub Pre-Release (sideload .vsix)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v${{ steps.ver.outputs.version }}
          name: Beta v${{ steps.ver.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: kubectl-control-${{ steps.ver.outputs.version }}.vsix
          body: |
            Beta-Build zum **manuellen Sideload** (`.vsix` unten herunterladen →
            VS Code ▸ Extensions ▸ „Install from VSIX…").

            Dieser Build ist **nicht** im VS Code Marketplace. Nutzer der Stable-Version
            werden dadurch **nicht** aktualisiert.
