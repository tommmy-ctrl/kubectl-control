name: Release & Publish

on:
  push:
    tags:
      - 'v*'   # triggers on v1.0.0, v1.2.3, etc.

jobs:
  release:
    name: Build, Package & Publish
    runs-on: ubuntu-latest

    # Only run for stable release tags of the form vX.Y.Z (plain SemVer, no suffix).
    # Beta tags are prefixed `beta-v…` and never match the `v*` trigger, so they
    # cannot reach this workflow; the `-` guard is an extra safety net.
    if: ${{ !contains(github.ref_name, '-') }}

    permissions:
      contents: write   # needed to upload release assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production dependencies only)
        # Only audit production deps — dev tools (mocha, webpack) are not bundled into the extension
        run: npm audit --audit-level=high --omit=dev

      - name: Convert SVG icon to PNG (128x128)
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 128 -h 128 resources/icon.svg -o resources/icon.png

      - name: Set version from git tag
        # --allow-same-version: package.json is usually already at this version
        # (set during promote), so npm must not error when it is unchanged.
        run: npm version "${GITHUB_REF_NAME#v}" --allow-same-version --no-git-tag-version

      - name: Build extension
        run: npm run package   # webpack production build

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package .vsix
        run: vsce package --out kubectl-control.vsix

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Print the section body between "## [VERSION]" and the next "## " heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md || true
          if [ -s RELEASE_NOTES.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using CHANGELOG.md section for $VERSION."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG.md section for $VERSION — falling back to auto-generated notes."
          fi

      - name: Create GitHub Release & upload .vsix
        uses: softprops/action-gh-release@v2
        with:
          files: kubectl-control.vsix
          # Prefer the curated CHANGELOG section; fall back to auto-generated notes.
          body_path: ${{ steps.notes.outputs.found == 'true' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}

      - name: Publish to VS Code Marketplace
        run: vsce publish --packagePath kubectl-control.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
