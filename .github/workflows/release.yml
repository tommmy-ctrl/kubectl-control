name: Release & Publish

on:
  push:
    tags:
      - 'v*'   # triggers on v1.0.0, v1.2.3, etc.

jobs:
  release:
    name: Build, Package & Publish
    runs-on: ubuntu-latest

    # Runs for stable release tags vX.Y.Z, and for Marketplace pre-release tags
    # vX.Y.Z-pre (see docs/RELEASE.md — the deliberate, documented pre-release
    # channel, distinct from the GitHub-only beta-v… sideload tags). Beta tags
    # are prefixed `beta-v…` and never match the `v*` trigger at all; the guard
    # below is an extra safety net against any other unexpected hyphenated tag.
    if: ${{ !contains(github.ref_name, '-') || endsWith(github.ref_name, '-pre') }}

    permissions:
      contents: write   # needed to upload release assets

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production dependencies only)
        # Only audit production deps — dev tools (mocha, webpack) are not bundled into the extension
        run: npm audit --audit-level=high --omit=dev

      - name: Convert SVG icon to PNG (128x128)
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 128 -h 128 resources/icon.svg -o resources/icon.png

      - name: Determine version and channel from tag
        id: meta
        run: |
          REF="${GITHUB_REF_NAME#v}"          # e.g. "1.4.0-pre" or "1.4.0"
          if [[ "$REF" == *-pre ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "version=${REF%-pre}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "version=$REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version from git tag
        # --allow-same-version: package.json is usually already at this version
        # (set during promote), so npm must not error when it is unchanged. The
        # manifest version itself never carries the -pre suffix — VS Code
        # requires a bare X.Y.Z; steps.meta strips it above.
        run: npm version "${{ steps.meta.outputs.version }}" --allow-same-version --no-git-tag-version

      - name: Build extension
        run: npm run package   # webpack production build
        env:
          BUILD_SHA: ${{ github.sha }}

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package .vsix
        run: |
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            vsce package --pre-release --out kubectl-control.vsix
          else
            vsce package --out kubectl-control.vsix
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          # Print the section body between "## [VERSION]" and the next "## " heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md || true
          if [ -s RELEASE_NOTES.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using CHANGELOG.md section for $VERSION."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG.md section for $VERSION — falling back to auto-generated notes."
          fi

      - name: Create GitHub Release & upload .vsix
        uses: softprops/action-gh-release@v3
        with:
          files: kubectl-control.vsix
          prerelease: ${{ steps.meta.outputs.prerelease }}
          # Prefer the curated CHANGELOG section; fall back to auto-generated notes.
          body_path: ${{ steps.notes.outputs.found == 'true' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}

      - name: Publish to VS Code Marketplace
        run: |
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            vsce publish --pre-release --packagePath kubectl-control.vsix
          else
            vsce publish --packagePath kubectl-control.vsix
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
