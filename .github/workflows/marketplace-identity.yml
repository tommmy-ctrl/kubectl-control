name: Marketplace identity (one-time setup)

# One-time setup (docs/RELEASE.md §3a step 5). It logs in as the publishing
# identity, creates its Azure DevOps profile (an identity that never talked to
# Azure DevOps has none, and the Marketplace can only add members that have one)
# and prints the ID to add as a publisher member. Nothing is published and no
# secret is printed.
#
# Triggers: a push to `beta` that changes this file (workflow_dispatch only works
# once the file also exists on the default branch `main`), or manually.

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths: ['.github/workflows/marketplace-identity.yml']

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      id-token: write
    steps:
      - name: Azure login (Entra ID via OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Create Azure DevOps profile and print its ID
        run: |
          # 499b84ac-… is the fixed Azure DevOps resource ID.
          ID=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
                 --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "Add this ID as a member (role: Contributor) of the Marketplace publisher:"
          echo "$ID"
          echo "### Marketplace member ID: \`$ID\`" >> "$GITHUB_STEP_SUMMARY"
