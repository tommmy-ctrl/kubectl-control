version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Group all dev tooling updates into one PR
      dev-tooling:
        dependency-type: "development"
    ignore:
      # TypeScript 7 is not yet supported by typescript-eslint (peer <6.1.0).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # @types/vscode must match engines.vscode (vsce rejects a newer one);
      # it is bumped by hand together with the engines field.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
